name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/settings/package-lock.json

      - name: Cache Rust
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('app/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install settings frontend
        working-directory: app/settings
        run: npm ci

      - name: Build settings frontend
        working-directory: app/settings
        run: npm run build

      - name: Check formatting
        working-directory: app
        run: cargo fmt --all --check

      - name: Clippy
        working-directory: app
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: app
        run: cargo test --workspace

      - name: Release build
        working-directory: app
        run: |
          cargo build --release -p iceberg-widget
          cargo build --release -p iceberg-settings --features custom-protocol
