name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Cache Rust
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            app/src-tauri/target
          key: ${{ runner.os }}-release-cargo-${{ hashFiles('app/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-cargo-

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Test
        working-directory: app/src-tauri
        run: cargo test

      - name: Build installer
        working-directory: app
        run: npm run tauri build

      - name: Write checksums
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "No installer found" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $line = "$hash  $($installer.Name)"
          Set-Content -Path "SHA256SUMS.txt" -Value $line -Encoding ascii
          Write-Output $line

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          gh release create $env:GITHUB_REF_NAME $installer.FullName "SHA256SUMS.txt" --title "Iceberg $env:GITHUB_REF_NAME" --generate-notes
