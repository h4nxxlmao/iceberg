[workspace]
resolver = "2"
members = ["core", "widget", "settings/src-tauri", "xtask"]
exclude = ["src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/h4nxxlmao/iceberg"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows = { version = "0.62.2" }
winit = "0.30.13"
cosmic-text = "0.19.0"
png = "0.18"
ttf-parser = "0.25"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "json", "gzip"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
