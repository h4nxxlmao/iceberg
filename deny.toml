[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.9

# The workspace itself is GPL-3.0-only. Keep the dependency allowlist permissive.
[[licenses.exceptions]]
name = "iceberg-core"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "iceberg-widget"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "iceberg-settings"
allow = ["GPL-3.0-only"]

[[licenses.exceptions]]
name = "xtask"
allow = ["GPL-3.0-only"]

[bans]
multiple-versions = "warn"
deny = [
  { name = "openssl" },
  { name = "openssl-sys" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
